<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI生成视频检测系统</title>
    <link rel="stylesheet" href="/static/css/index.css">
</head>
<body>
    <div class="container">
        <h1>AI生成视频检测系统</h1>
        <p class="subtitle">基于深度学习的人工智能视频真伪鉴别平台</p>
        
        <div style="text-align: center; margin-bottom: 20px;">
            <a href="/history" class="btn">查看历史记录</a>
        </div>

        <div class="disclaimer" id="disclaimer">
            <h4>提示</h4>
            <p>
                本系统采用AI技术进行视频真伪鉴别，检测结果仅供参考。
                不对检测结果的准确性做出任何保证，建议结合其他手段综合判断。
                请理性看待检测结论，谨慎辨别视频内容。
            </p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="uploadForm" enctype="multipart/form-data">
            <div class="layout">
                <div class="panel panel-left">
                    <div class="upload-area" id="uploadArea">
                        <div id="uploadPlaceholder">
                            <div class="upload-text">点击选择视频或拖拽到此处</div>
                            <div class="upload-hint">支持格式：MP4,AVI,MOV,MKV,WMV,FLV（最大500MB）</div>
                        </div>
                        <video id="uploadVideo" muted playsinline style="display: none;"></video>
                        <input type="file" id="fileInput" name="video" accept="video/*">
                    </div>
                </div>

                <div class="panel">
                    <div class="field-row">
                        <label>热力图数量</label>
                        <input type="number" id="attnTopK" value="5">
                        <div class="field-hint">建议3-10</div>
                    </div>

                    <div class="field-row">
                        <label>判定阈值</label>
                        <input type="number" id="threshold" value="0.10" step="0.01">
                    </div>

                    <div class="field-row">
                        <label>抽帧间隔</label>
                        <input type="number" id="frameInterval" value="0">
                        <div class="field-hint">0表示全部帧</div>
                        <div class="field-hint">x表示帧间隔，提取x,x+1,x+2,x+4</div>
                    </div>

                    <button type="submit" class="btn" id="submitBtn">开始检测</button>
                </div>
            </div>

            <div class="file-info" id="fileInfo">
                <div class="file-name" id="fileName"></div>
                <div class="file-size" id="fileSize"></div>
                <button type="button" id="clearFileBtn">清除文件</button>
            </div>
        </form>

        <div class="loading" id="loading">
            <div>正在分析视频，请稍候...</div>
            <div id="progressInfo">初始化中...</div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const uploadForm = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alert');
        const uploadArea = document.getElementById('uploadArea');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const uploadVideo = document.getElementById('uploadVideo');
        const fileInfo = document.getElementById('fileInfo');
        const clearFileBtn = document.getElementById('clearFileBtn');

        let selectedFile = null;

        // 点击上传区域触发文件选择
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // 拖拽支持
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        // 清除文件
        clearFileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            selectedFile = null;
            fileInput.value = '';
            fileInfo.classList.remove('show');
            uploadPlaceholder.style.display = '';
            uploadVideo.onerror = null;
            uploadVideo.style.display = 'none';
            uploadVideo.src = '';
            alertBox.className = 'alert';
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            handleFile(file);
        });

        async function handleFile(file) {
            selectedFile = file;
            fileName.textContent = '文件名：' + file.name;
            fileSize.textContent = '大小：' + formatSize(file.size);
            fileInfo.classList.add('show');

            // 先用 blob URL 尝试本地播放
            uploadVideo.onerror = null;
            uploadVideo.loop = true;
            uploadVideo.src = URL.createObjectURL(file);
            uploadVideo.style.display = 'block';
            uploadPlaceholder.style.display = 'none';
            uploadVideo.play().catch(() => {});

            // 若浏览器无法解码，则请求后端 FFmpeg 转码预览
            uploadVideo.onerror = async () => {
                uploadVideo.onerror = null;
                showAlert('当前格式浏览器不支持预览，正在转码请稍候...', 'info');
                const fd = new FormData();
                fd.append('video', file);
                try {
                    const res = await fetch('/preview', { method: 'POST', body: fd });
                    const data = await res.json();
                    if (data.success) {
                        uploadVideo.src = data.previewUrl;
                        uploadVideo.play().catch(() => {});
                        alertBox.className = 'alert'; // 隐藏提示
                    } else {
                        showAlert('预览转码失败：' + data.message, 'error');
                        uploadVideo.style.display = 'none';
                        uploadPlaceholder.style.display = '';
                    }
                } catch (err) {
                    showAlert('转码请求失败：' + err.message, 'error');
                    uploadVideo.style.display = 'none';
                    uploadPlaceholder.style.display = '';
                }
            };
        }

        function formatSize(size) {
            if (size < 1024) return size + ' B';
            if (size < 1024 * 1024) return (size / 1024).toFixed(2) + ' KB';
            return (size / (1024 * 1024)).toFixed(2) + ' MB';
        }

        function showAlert(msg, type) {
            alertBox.textContent = msg;
            alertBox.className = 'alert show ' + type;
        }

        const loadingDiv = document.getElementById('loading');
        const progressInfo = document.getElementById('progressInfo');

        function setLoading(on) {
            if (on) {
                loadingDiv.classList.add('show');
                submitBtn.disabled = true;
                uploadArea.classList.add('disabled');
            } else {
                loadingDiv.classList.remove('show');
                submitBtn.disabled = false;
                uploadArea.classList.remove('disabled');
            }
        }

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!selectedFile) {
                showAlert('请先选择视频', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('video', selectedFile);
            formData.append('attnTopK', document.getElementById('attnTopK').value);
            formData.append('threshold', document.getElementById('threshold').value);
            formData.append('everyN', document.getElementById('frameInterval').value);

            setLoading(true);
            progressInfo.textContent = '上传中...';

            try {
                const res = await fetch('/upload', { method: 'POST', body: formData });
                const data = await res.json();

                if (!data.success) {
                    showAlert('上传失败：' + data.message, 'error');
                    setLoading(false);
                    return;
                }

                progressInfo.textContent = '等待检测队列...';

                // 通过 SSE 等待异步检测结果
                const evtSource = new EventSource('/progress/' + data.taskId);

                evtSource.onmessage = (event) => {
                    const msg = JSON.parse(event.data);

                    if (msg.type === 'queued') {
                        progressInfo.textContent = '排队中，前方还有 ' + msg.position + ' 个任务...';
                    } else if (msg.type === 'start') {
                        progressInfo.textContent = '正在分析...';
                    } else if (msg.type === 'progress') {
                        if (msg.frames && msg.total) {
                            progressInfo.textContent = '已处理 ' + msg.frames + ' / ' + msg.total + ' 帧';
                        } else {
                            progressInfo.textContent = msg.message || '处理中...';
                        }
                    } else if (msg.type === 'complete') {
                        evtSource.close();
                        const resultObj = JSON.parse(msg.result);
                        if (msg.attentionMapUrl) {
                            resultObj.attentionMapUrl = msg.attentionMapUrl;
                        }
                        sessionStorage.setItem('lastDetectionResult', JSON.stringify(resultObj));
                        sessionStorage.setItem('lastDetectionFilename', msg.filename || data.filename);
                        sessionStorage.setItem('lastDetectionMeta', JSON.stringify({
                            detectEndTime: msg.detectEndTime,
                            queueDurationMs: msg.queueDurationMs,
                            detectDurationMs: msg.detectDurationMs
                        }));
                        window.location.href = '/result?filename=' + encodeURIComponent(msg.filename || data.filename);
                    } else if (msg.type === 'error') {
                        evtSource.close();
                        showAlert('检测失败：' + msg.message, 'error');
                        setLoading(false);
                    }
                };

                evtSource.onerror = () => {
                    evtSource.close();
                    showAlert('连接中断，请刷新页面重试', 'error');
                    setLoading(false);
                };

            } catch (err) {
                showAlert('网络错误：' + err.message, 'error');
                setLoading(false);
            }
        });
    </script>
</body>
</html>
