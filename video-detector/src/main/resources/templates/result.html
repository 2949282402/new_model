<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>检测结果 - AI生成视频检测系统</title>
    <link rel="stylesheet" href="/static/css/result.css">
</head>
<body>
    <div class="container">
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button type="button" class="btn" id="backBtn">返回上一页</button>
            <a href="/" class="btn">返回上传页面</a>
        </div>

        <div class="card fade-in">
            <h1>检测报告</h1>

            <div class="result-header">
                <div class="result-title" id="resultTitle">分析中...</div>
                <div style="color: #666; font-size: 14px;">
                    视频文件：<span id="videoName" style="font-weight: 600;"></span>
                </div>
            </div>

            <div class="info-section">
                <div style="margin-bottom: 16px; padding: 12px; background: #f7f7f7; border-radius: 6px; border: 1px solid #ddd;">
                    <h4 style="margin: 0 0 8px 0; color: #333; font-size: 14px;">提示</h4>
                    <p style="margin: 0; color: #666; line-height: 1.5; font-size: 13px;">
                        本检测结果仅供参考，不构成任何形式的保证或承诺。AI检测技术可能存在误差，
                        建议结合其他方法和专业判断进行综合评估。对于因依赖本检测结果而做出的任何决策，
                        我们不承担责任。请理性看待检测结论。
                    </p>
                </div>

                <div class="info-item">
                    <div class="info-label">AI生成概率:</div>
                    <div class="info-value">
                        <div class="probability-bar">
                            <div class="probability-fill" id="probabilityBar" style="width: 0%;">0%</div>
                        </div>
                        <div class="probability-text" id="probabilityText">0%</div>
                        <div style="margin-top: 6px; color: #777; font-size: 12px;">
                            概率映射说明：0-0.1 映射为 0%-50%，0.1-1 映射为 50%-100%
                        </div>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-label">判定阈值</div>
                    <div class="info-value">50%（原始 0.1）</div>
                </div>

                <div class="info-item">
                    <div class="info-label">检测结果</div>
                    <div class="info-value">
                        <span class="badge" id="resultBadge">等待结果</span>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-label">分析帧数:</div>
                    <div class="info-value" id="frameCount">-</div>
                </div>

                <div class="info-item">
                    <div class="info-label">检测时间</div>
                    <div class="info-value" id="detectTime">-</div>
                </div>

                <div class="info-item">
                    <div class="info-label">排队耗时:</div>
                    <div class="info-value" id="queueDuration">-</div>
                </div>

                <div class="info-item">
                    <div class="info-label">检测耗时:</div>
                    <div class="info-value" id="detectDuration">-</div>
                </div>
            </div>

            <div class="attention-section" id="attentionSection" style="display: none;">
                <div class="details-title">Attention热力图</div>
                <div class="attention-content">
                    <img id="attentionImage" class="attention-image" src="" alt="Attention热力图"
                         style="max-width: 100%; border-radius: 6px; border: 1px solid #e0e0e0;" title="点击查看大图" />
                </div>
            </div>

            <div class="image-modal" id="imageModal">
                <button class="close-btn" id="modalCloseBtn">关闭</button>
                <img id="modalImage" src="" alt="热力图大图" />
            </div>

            <div class="details-section">
                <div class="details-title">详细分析</div>
                <div class="details-content" id="detailsContent">等待结果...</div>
            </div>

            <div class="btn-container">
                <button type="button" class="btn" id="exportPdfBtn">导出PDF报告</button>
            </div>
        </div>
    </div>

    <script>
        console.log('[结果页面] 页面加载');

        const urlParams = new URLSearchParams(window.location.search);
        const filename = urlParams.get('filename');
        const filepath = urlParams.get('filepath');

        const storedResult = sessionStorage.getItem('lastDetectionResult');
        const storedMeta = sessionStorage.getItem('lastDetectionMeta');

        let resultData = null;
        let metaData = null;

        if (storedResult) {
            resultData = JSON.parse(storedResult);
        }

        if (storedMeta) {
            metaData = JSON.parse(storedMeta);
        }

        document.getElementById('videoName').textContent = filename || '未知文件';

        function formatDuration(ms) {
            if (!ms) return '-';
            const sec = Math.floor(ms / 1000);
            return sec + ' 秒';
        }

        if (resultData && resultData.success) {
            const probability = parseFloat(resultData.probability) || 0;
            const percent = (probability * 100).toFixed(2);

            document.getElementById('probabilityBar').style.width = percent + '%';
            document.getElementById('probabilityText').textContent = percent + '%';

            const isReal = probability < 0.5;
            document.getElementById('resultTitle').textContent = isReal ? '真实视频' : 'AI生成视频';

            const badge = document.getElementById('resultBadge');
            badge.textContent = isReal ? '真实视频' : 'AI生成视频';
            badge.classList.add(isReal ? 'badge-real' : 'badge-ai');

            document.getElementById('frameCount').textContent = resultData.frames || '-';

            if (metaData) {
                document.getElementById('detectTime').textContent = metaData.detectEndTime || '-';
                document.getElementById('queueDuration').textContent = formatDuration(metaData.queueDurationMs);
                document.getElementById('detectDuration').textContent = formatDuration(metaData.detectDurationMs);
            }

            document.getElementById('detailsContent').textContent = resultData.details || '无详细信息';

            // 显示热力图
            const attentionUrl = resultData.attentionMapUrl || '';
            if (attentionUrl) {
                const attentionImage = document.getElementById('attentionImage');
                attentionImage.src = attentionUrl;
                document.getElementById('attentionSection').style.display = '';

                // 点击放大
                const modal = document.getElementById('imageModal');
                const modalImage = document.getElementById('modalImage');
                attentionImage.addEventListener('click', () => {
                    modalImage.src = attentionUrl;
                    modal.classList.add('show');
                });
                document.getElementById('modalCloseBtn').addEventListener('click', () => {
                    modal.classList.remove('show');
                });
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) modal.classList.remove('show');
                });
            }

        } else {
            document.getElementById('resultTitle').textContent = '检测失败';
            document.getElementById('detailsContent').textContent = '未获取到结果';
        }

        document.getElementById('backBtn').onclick = () => history.back();
        document.getElementById('exportPdfBtn').onclick = () => window.print();
    </script>
</body>
</html>
