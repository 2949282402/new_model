<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史检测记录 - AI生成视频检测系统</title>
    <link rel="stylesheet" href="/static/css/history.css">
</head>
<body>
    <div class="container">
        <div class="top-nav">
            <a href="/" class="btn">返回首页</a>
        </div>

        <h1>历史检测记录</h1>
        <p class="subtitle">查看和管理全部检测记录</p>

        <div class="record-list" th:if="${records != null and !records.isEmpty()}">
            <div class="record-item" th:each="record : ${records}">
                <div class="record-header">
                    <div class="record-title">
                        <span class="filename" th:text="${record.originalFilename}">文件名</span>
                        <span class="badge"
                              th:classappend="${record.result != null and record.result.contains('真实') ? 'badge-real' : 'badge-ai'}"
                              th:text="${record.result != null ? #strings.replace(record.result, 'AI 生成', 'AI生成') : '检测中'}">结果</span>
                    </div>
                </div>

                <div class="record-info">
                    <div class="info-item">
                        <span class="info-label">检测耗时</span>
                        <span th:if="${record.detectDurationMs != null}"
                              th:text="${#numbers.formatDecimal(record.detectDurationMs / 1000.0, 1, 1)} + ' 秒'">-</span>
                        <span th:unless="${record.detectDurationMs != null}">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">概率</span>
                        <span th:if="${record.probability != null}" th:text="${record.probability} + '%'">-</span>
                        <span th:unless="${record.probability != null}">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">分析帧数</span>
                        <span th:if="${record.frameCount != null}" th:text="${record.frameCount}">-</span>
                        <span th:unless="${record.frameCount != null}">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">热力图数量</span>
                        <span th:if="${record.attnTopK != null}" th:text="${record.attnTopK}">-</span>
                        <span th:unless="${record.attnTopK != null}">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">判定阈值</span>
                        <span th:if="${record.threshold != null}" th:text="${#numbers.formatDecimal(record.threshold, 1, 2)}">-</span>
                        <span th:unless="${record.threshold != null}">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">抽帧间隔</span>
                        <span th:if="${record.everyN != null}" th:text="${record.everyN}">-</span>
                        <span th:unless="${record.everyN != null}">-</span>
                    </div>
                </div>

                <div class="record-actions">
                    <a href="#"
                       class="btn view-btn"
                       th:data-id="${record.id}"
                       th:data-filepath="${record.filePath}"
                       th:data-attention="${record.attentionMapPath}"
                       th:data-result="${record.result}"
                       th:data-probability="${record.probability}"
                       th:data-framecount="${record.frameCount}"
                       th:data-details="${record.details}"
                       th:data-queueduration="${record.queueDurationMs}"
                       th:data-detectduration="${record.detectDurationMs}"
                       th:data-attntopk="${record.attnTopK}"
                       th:data-threshold="${record.threshold}"
                       th:data-everyn="${record.everyN}"
                       th:data-detecttime="${#temporals.format(record.detectTime, 'yyyy-MM-dd HH:mm:ss')}">
                        查看详情
                    </a>
                    <button type="button" class="btn delete-btn" th:data-record-id="${record.id}">
                        删除记录
                    </button>
                </div>
            </div>
        </div>

        <div class="empty-state" th:if="${records == null or records.isEmpty()}">
            <h3>暂无检测记录</h3>
            <p style="margin-top: 10px;">当前还没有可查看的历史结果</p>
            <a href="/" class="btn" style="margin-top: 20px;">开始检测</a>
        </div>
    </div>

    <script>
        const DETECTION_SESSION_KEYS = [
            'lastDetectionResult',
            'lastDetectionFilename',
            'lastDetectionFilepath',
            'lastDetectionMeta',
            'attentionMapPath'
        ];

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.view-btn').forEach((button) => {
                button.addEventListener('click', (event) => {
                    event.preventDefault();
                    openRecordDetail(button);
                });
            });

            document.querySelectorAll('.delete-btn').forEach((button) => {
                button.addEventListener('click', (event) => {
                    event.preventDefault();
                    deleteRecord(button.getAttribute('data-record-id'));
                });
            });
        });

        function clearDetectionSession() {
            DETECTION_SESSION_KEYS.forEach((key) => sessionStorage.removeItem(key));
        }

        function openRecordDetail(button) {
            const filepath = button.getAttribute('data-filepath') || '';
            const attentionPath = button.getAttribute('data-attention') || '';
            const resultStr = button.getAttribute('data-result') || '';
            const probabilityStr = button.getAttribute('data-probability') || '';
            const frameCountStr = button.getAttribute('data-framecount') || '';
            const detailsStr = button.getAttribute('data-details') || '';
            const queueDurationStr = button.getAttribute('data-queueduration') || '';
            const detectDurationStr = button.getAttribute('data-detectduration') || '';
            const attnTopKStr = button.getAttribute('data-attntopk') || '';
            const thresholdStr = button.getAttribute('data-threshold') || '';
            const everyNStr = button.getAttribute('data-everyn') || '';
            const detectTimeStr = button.getAttribute('data-detecttime') || '';

            clearDetectionSession();

            if (attentionPath.trim()) {
                sessionStorage.setItem('attentionMapPath', attentionPath);
            }

            const recordItem = button.closest('.record-item');
            const filenameElement = recordItem ? recordItem.querySelector('.filename') : null;
            const filename = filenameElement ? filenameElement.textContent.trim() : '';

            let normalizedProb = '';
            const rawProb = parseFloat(probabilityStr);
            if (Number.isFinite(rawProb)) {
                normalizedProb = (rawProb / 100).toFixed(4);
            }

            const historyResult = {
                success: true,
                probability: normalizedProb,
                result: resultStr,
                frames: frameCountStr,
                details: detailsStr || '无详细分析数据',
                attentionMapPath: attentionPath
            };

            sessionStorage.setItem('lastDetectionResult', JSON.stringify(historyResult));
            sessionStorage.setItem('lastDetectionFilename', filename);
            sessionStorage.setItem('lastDetectionFilepath', filepath);
            sessionStorage.setItem('lastDetectionMeta', JSON.stringify({
                detectEndTime: detectTimeStr,
                queueDurationMs: queueDurationStr ? Number(queueDurationStr) : null,
                detectDurationMs: detectDurationStr ? Number(detectDurationStr) : null,
                attnTopK: attnTopKStr ? Number(attnTopKStr) : null,
                threshold: thresholdStr ? Number(thresholdStr) : null,
                everyN: everyNStr ? Number(everyNStr) : null
            }));

            const url = '/result?filename=' + encodeURIComponent(filename) +
                '&filepath=' + encodeURIComponent(filepath);
            window.location.href = url;
        }

        function deleteRecord(id) {
            if (!confirm('确定要删除这条检测记录吗？这会同时删除相关视频、热力图及中间文件。')) {
                return;
            }

            fetch('/delete/' + id, { method: 'POST' })
                .then((response) => response.json())
                .then((data) => {
                    if (data.success) {
                        alert('记录已删除');
                        window.location.reload();
                        return;
                    }
                    alert('删除失败：' + data.message);
                })
                .catch((error) => {
                    console.error('Delete failed:', error);
                    alert('网络错误，删除失败');
                });
        }
    </script>
</body>
</html>
